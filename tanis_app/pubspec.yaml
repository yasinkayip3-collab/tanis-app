name: tanis_app
description: Arkadaşlık ve tanışma uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.0
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  go_router: ^13.2.0
  flutter_local_notifications: ^17.0.0
  cupertino_icons: ^1.0.6
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#7F77DD"
  adaptive_icon_foreground: "assets/app_icon_fg.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/splash_heart.jpg"
  android: true
  ios: true
  android_12:
    color: "#ffffff"
    icon_background_color: "#EEEDFE"
    image: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/splash_heart.jpg
    - assets/app_icon.png
